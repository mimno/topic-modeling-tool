name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            label: mac-arm64
          - os: macos-15-intel  # Intel
            label: mac-x64
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04    # oldest supported; its .deb also installs on newer releases
            label: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: TopicModelingTool

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Package installer
        run: ./package-app.sh

      # Install each package the way a user would, then train a small model
      # with the installed app in batch mode.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" target/dist/*.dmg
          "$RUNNER_TEMP/dmg/Topic Modeling Tool.app/Contents/MacOS/Topic Modeling Tool" \
            --batch src/test/resources/data/subset "$RUNNER_TEMP/smoke" 5
          ls "$RUNNER_TEMP"/smoke/subset-*/output_html/index.html

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/dist/*.deb
          "/opt/topic-modeling-tool/bin/Topic Modeling Tool" \
            --batch src/test/resources/data/subset "$RUNNER_TEMP/smoke" 5
          ls "$RUNNER_TEMP"/smoke/subset-*/output_html/index.html

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target/dist/*.msi).FullName
          $install = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /l*v install.log"
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 50; exit 1 }
          $exe = "C:\Program Files\Topic Modeling Tool\Topic Modeling Tool.exe"
          $out = Join-Path $env:RUNNER_TEMP "smoke"
          $run = Start-Process $exe -Wait -PassThru -ArgumentList "--batch", "src/test/resources/data/subset", "`"$out`"", "5"
          if ($run.ExitCode -ne 0) { exit 1 }
          Get-ChildItem "$out/subset-*/output_html/index.html"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TopicModelingTool-${{ matrix.label }}
          path: TopicModelingTool/target/dist/*

      - name: Upload runnable jar
        if: matrix.label == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: TopicModelingTool-jar
          path: TopicModelingTool/target/TopicModelingTool.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Name installers by platform
        run: |
          for dir in dist/TopicModelingTool-mac-*; do
            label=${dir#dist/TopicModelingTool-}
            for f in "$dir"/*.dmg; do mv "$f" "${f%.dmg}-$label.dmg"; done
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
